<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Workshop: Animals</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>GitHub Workshop: Animals</h1>
    <div class="team-grid">

        <div class="team-card">
            <h2 class="team-name">Team 1</h2>
            <div class="ani-slot" id="slot-team1"></div>
            <button class="button1" data-team="team1">SHOW ME THE DOG</button>
        </div>

        <div class="team-card">
            <h2 class="team-name">Team 2</h2>
            <div class="ani-slot" id="slot-team2"></div>
            <button class="button" data-team="team2">SHOW ME THE CAT</button>
        </div>

        <div class="team-card">
            <h2 class="team-name">Team 3</h2>
            <div class="ani-slot" id="slot-team3"></div>
            <button class="button" data-team="team3">SHOW ME THE MONKEY</button>
        </div>

        <div class="team-card">
            <h2 class="team-name">Team 4</h2>
            <div class="ani-slot" id="slot-team4"></div>
            <button class="button" data-team="team4">SHOW ME THE FISH</button>
        </div>

        <div class="team-card">
            <h2 class="team-name">Team 5</h2>
            <div class="ani-slot" id="slot-team5"></div>
            <button class="button" data-team="team5">SHOW ME THE BIRD</button>
        </div>

    </div>
    <script src="script.js" defer></script>
</body>
</html>
